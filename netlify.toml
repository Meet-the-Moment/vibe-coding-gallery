# Netlify builds this on every push to main and makes a preview for every pull request.
# The build runs the gallery rules first, so a pull request that breaks them shows a failed preview.
#
# NEVER add environment variables or secrets to this Netlify site. The repo is public and pull
# requests come from people outside MTM, so a preview build could read anything stored here.
# The gallery needs no secrets at all.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Every page: no framing by other sites, no sniffing, no referrer leakage.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The games themselves: whatever is inside the file, the browser refuses to let it contact any
# other site or send anything anywhere. This is the safety net behind the rules check.
[[headers]]
  for = "/games/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
